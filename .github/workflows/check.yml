name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TELEMETRY_DISABLED: '1'
      # The regrowth check judges what a change adds: a pull request against its base branch, a
      # push against the head it replaced (main included), and a new branch against main.
      REGROWTH_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/install-bun.mjs
      - run: echo "$GITHUB_WORKSPACE/.vercel/bun/bin" >> "$GITHUB_PATH"
      - run: bun --version
      - run: node --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run vercel-build
