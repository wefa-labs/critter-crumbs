name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TELEMETRY_DISABLED: '1'
      # The regrowth check judges what a change adds: a pull request against its base branch, a
      # push against the head it replaced (main included), and a new branch against main.
      REGROWTH_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/install-bun.mjs
      - run: echo "$GITHUB_WORKSPACE/.vercel/bun/bin" >> "$GITHUB_PATH"
      - run: bun --version
      - run: node --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run vercel-build

  e2e:
    # The browser suites against the local stack, which Playwright starts (tests/stack.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/install-bun.mjs
      - run: echo "$GITHUB_WORKSPACE/.vercel/bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for Playwright
        run: node node_modules/playwright/cli.js install --with-deps chromium
      # The app sets type in the system font. Ubuntu's falls back to DejaVu Sans, wider than any phone's, so the screens
      # suite's fit checks render in Roboto, Android's system font, instead.
      - name: Render the system font as a phone does
        run: |
          sudo apt-get install -y --no-install-recommends fonts-roboto-unhinted
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
            <alias binding="strong"><family>sans</family><prefer><family>Roboto</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f
          fc-match system-ui
          fc-match sans-serif
      - name: Lifecycle suite
        run: bun run e2e
      - name: Screens suite
        run: node node_modules/playwright/cli.js test --config playwright.screens.config.ts
      - name: Keep the failing runs' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results/
            .scratch/screens/test-results/
          retention-days: 7
