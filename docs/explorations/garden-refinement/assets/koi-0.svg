<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" class="portrait portrait-v2 critter garden garden-refined finish-painted species-koi element-water flier" data-direction="garden-refined" data-species="koi" data-element="water" data-asleep="false" data-size="130" data-top="0.281" data-left="0.180" data-right="0.898" data-hy="0.590" data-hr="0.194" data-head-x="0.433" data-hover="0.185" width="130" height="162.5" aria-hidden="true" style="--d: 3.91s; --cheeks: 0; --mouth: 0; --garden-lift: 0px;"><style>.portrait { display:block; overflow:visible; width:100%; height:auto; --scale-x:1; --scale-y:1; --head-tilt:0deg; --lean-z:0deg; --lift-y:0px; --lids:1; --cheeks:0; --mouth:0; --ear-l:0deg; --ear-r:0deg; --pupil-x:0px; --pupil-y:0px; }
.portrait[data-size="40"] { width:40px; }
.portrait[data-size="64"] { width:64px; }
.portrait[data-size="96"] { width:96px; }
.portrait__figure { transform-origin:60px 140px; transform:translateY(calc(-1 * var(--lift-y))) rotate(var(--lean-z)) scale(var(--scale-x),var(--scale-y)); }
.portrait__shadow { transform-origin:60px 141px; transform:scaleX(var(--scale-x)); }
.portrait__head { transform:rotate(var(--head-tilt)); }
.portrait__ear { transform:rotate(var(--ear-base)); }
.portrait__ear--l { transform:rotate(calc(var(--ear-base) + var(--ear-l))); }
.portrait__ear--r { transform:rotate(calc(var(--ear-base) - var(--ear-r))); }
.portrait__eye { scale:1 var(--lids); }
.portrait__pupil { transform:translate(var(--pupil-x),var(--pupil-y)); }
.portrait__sleep-eye { opacity:0; }
.portrait[data-asleep="true"] .portrait__eye { opacity:0; }
.portrait[data-asleep="true"] .portrait__sleep-eye { opacity:1; }
.portrait__cheek { scale:var(--cheeks); }
.portrait-fade { pointer-events:none; }

.portrait-v2 .p-calm { opacity:calc(1 - var(--mouth)); }
.portrait-v2 .portrait__mouth { opacity:var(--mouth); }


.garden-refined .cr-hover { transform:translateY(var(--garden-lift,0px)); }
/* A wing group's origin is its root (species.ts, wingAt). Keep the default transform box and origin here: a fill-box
   origin would also re-centre the group's own mirror transform and stack the left wing on the right. */
.garden-refined[data-asleep="true"] .cr-wing { scale:.78 1; }
.garden-refined .portrait__head,.garden-refined .portrait__eye,.garden-refined .portrait__cheek { transform-box:view-box; transform-origin:0 0; }
.garden-refined .portrait__eye { transform-origin:center; transform-box:fill-box; }
.garden-refined .portrait__cheek { transform-origin:center; transform-box:fill-box; }
.garden-refined[data-asleep="true"] .p-calm { opacity:.65; }
